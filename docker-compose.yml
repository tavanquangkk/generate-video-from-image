services:
    api-server:
        build: .
        container_name: gen-video-api
        ports:
            - "3000:3000"
        volumes:
            - "./outputs:/app/outputs"
            - "./watch-folder:/app/uploads"
            - "./music:/app/music"
        environment:
            - OUTPUT_DIR=/app/outputs

    n8n:
        image: n8nio/n8n:latest
        container_name: n8n-automation
        user: root
        ports:
            - "5678:5678"
        volumes:
            - n8n_data:/home/node/.n8n
            - "./watch-folder:/data/watch"
            - "./outputs:/data/outputs"
        environment:
            - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
            - N8N_RESTRICT_FILE_ACCESS_TO=/data
            - NODES_EXCLUDE="[]"
            - N8N_LOG_LEVEL=debug
        depends_on:
            - api-server

volumes:
    n8n_data:
